<style>
:root{
  --bg:#F5F5F7;--side:#1D1D1F;--card:#fff;--text:#1D1D1F;--muted:#6E6E73;--faint:#AEAEB2;
  --accent:#F04A2B;--blue:#1C6FE0;--green:#2F6B3E;--red:#B23A1F;--amber:#8A6414;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 22px -16px rgba(0,0,0,.16);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}

/* Layout */
.layout{display:flex;min-height:100vh}
.sidebar{width:232px;flex-shrink:0;background:var(--side);display:flex;flex-direction:column;padding:24px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px}
.brand img{width:22px;height:auto;display:block}
.brand-name{color:#fff;font-weight:800;font-size:17px;letter-spacing:-.02em;line-height:1.1}
.brand-sub{color:var(--accent);font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:none;color:#98989D;font-size:14px;font-weight:500;border-radius:999px;padding:9px 14px}
.nav-item:hover{color:#fff}
.nav-item.active{background:#fff;color:var(--text);font-weight:600}
.nav-badge{font-size:11px;font-weight:700;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:1px 8px}
.nav-item.active .nav-badge{background:#EDEDF0;color:var(--text)}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6E6E73;padding:14px 14px 4px}
.nav-div{height:1px;background:rgba(255,255,255,.08);margin:10px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.1)}
.me-name{color:#fff;font-size:13px;font-weight:600}
.me-out{background:none;border:none;color:#86868B;font-size:12px;font-weight:600;padding:0}
.me-out:hover{color:#fff}
.main{flex:1;min-width:0;padding:30px 32px 56px;display:flex;flex-direction:column;gap:24px}

/* Type and controls */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.sub{margin:4px 0 0;font-size:13px;color:var(--muted)}
.h2{margin:0 0 10px;font-size:15px;font-weight:800}
.btn{border:none;border-radius:999px;padding:10px 20px;font-size:14px;font-weight:600;background:var(--side);color:#fff;white-space:nowrap}
.btn:hover{background:#000}
.btn-soft{background:#EDEDF0;color:var(--text)}
.btn-soft:hover{background:#E3E3E8}
.btn-red{background:var(--red)}
.btn-red:hover{background:#8f2e18}
.btn-sm{padding:7px 14px;font-size:12.5px}
.btn-danger{background:none;border:none;color:var(--red);font-weight:600;font-size:13.5px;padding:8px 0}
.back{align-self:flex-start;background:none;border:none;color:var(--muted);font-weight:600;font-size:13px;padding:0}
.link{background:none;border:none;color:var(--blue);font-size:12.5px;font-weight:600;padding:0}
.link.red{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap;line-height:1.4}
.pill.r{background:#FBE1D9;color:#B23A1F}.pill.a{background:#FFF1D6;color:#8A6414}.pill.b{background:#E4EFFC;color:#1C6FE0}
.pill.g{background:#DCEEE0;color:#2F6B3E}.pill.n{background:#EDEDF0;color:#4A4A4F}.pill.o{background:#FEE7E1;color:#C23A1E}
.mini{font-size:11.5px;color:var(--muted);font-weight:600}
.faint{color:var(--faint)}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.seg{display:flex;background:#E8E8ED;border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:none;background:none;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg.nav-seg button{flex:none;min-width:32px}
.inp{border:1px solid #E4E4E7;border-radius:12px;padding:9px 12px;font-size:14px;background:#fff;width:100%;min-width:0}
.inp:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(28,111,224,.14)}
textarea.inp{resize:vertical;min-height:88px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.label{font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.hint{font-size:11.5px;color:var(--faint)}
.money-inp{position:relative}
.money-inp span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted);font-weight:600}
.money-inp .inp{padding-left:28px}

/* Tiles and lists */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tile{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid transparent;min-width:0}
button.tile:hover{border-color:#E4E4E7}
.tile-label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.tile-value{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.tile-sub{font-size:12px;color:var(--muted)}
.avatar{border-radius:999px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;width:26px;height:26px;font-size:10px}
.stack{display:inline-flex}
.stack .avatar{border:2px solid #fff;margin-left:-8px}
.stack .avatar:first-child{margin-left:0}
.list{background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;align-items:center;gap:12px;padding:12px 20px;border:none;border-top:1px solid #F2F2F4;background:none;width:100%;text-align:left}
.row:first-child{border-top:none}
button.row:hover{background:#FAFAFB}
.row-head{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding-top:10px;padding-bottom:8px}
.dl-row{grid-template-columns:130px minmax(0,1fr) 100px 104px}
.end{justify-self:end}
.center-x{justify-self:center}
.people-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.person-card{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:16px 18px;display:flex;align-items:center;gap:12px;border:1px solid transparent;text-align:left;min-width:0}
.person-card:hover{border-color:#E4E4E7}
.empty{padding:18px 20px;color:var(--faint);font-size:13.5px}

/* Completion details */
.done-meta{display:flex;gap:14px;font-size:11.5px;color:var(--muted)}
.done-meta b{font-weight:700;color:var(--text);margin-left:2px}
.done-box{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid #E4E4E7;border-radius:12px;padding:10px 12px}
.done-box-date{font-size:14px;font-weight:700}
.arch-row{grid-template-columns:minmax(0,1fr) 100px 80px 80px 130px}
@media (max-width:1000px){.arch-row{grid-template-columns:minmax(0,1fr) 80px 64px 64px 112px}}

/* Leaderboard */
.lb-row{grid-template-columns:40px 34px 170px minmax(0,1fr) 44px;padding-top:11px;padding-bottom:11px}
.lb-row.me{background:#F7F9FE}
.lb-rank{font-size:13px;font-weight:800;color:var(--faint)}
.lb-rank.lead{font-size:17px}
.lb-track{height:10px;background:#EEEEF2;border-radius:999px;overflow:hidden}
.lb-fill{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .4s ease}
.lb-fill.lead{background:var(--accent)}
.lb-n{justify-self:end;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
@media (max-width:1000px){.lb-row{grid-template-columns:36px 34px 120px minmax(0,1fr) 40px}}

/* Boards */
.board{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px;min-height:240px;border-radius:18px;padding:4px;transition:background .15s}
.col.over{background:rgba(28,111,224,.08)}
.col-head{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:2px 6px 4px}
.col-title{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.col-meta{display:flex;align-items:center;gap:6px}
.count{font-size:12px;font-weight:700;color:var(--muted);background:#E8E8ED;border-radius:999px;padding:2px 10px}
.tcard{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:9px;cursor:pointer;border:1px solid transparent;min-width:0}
.tcard:hover{border-color:#E4E4E7}
.tcard.dragging{opacity:.4}
.tcard.done .tcard-title{text-decoration:line-through;text-decoration-color:#C7C7CC;color:var(--muted)}
.tcard.faded{opacity:.6}
.tcard-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tcard-title{font-size:13.5px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.tcard-desc{font-size:12px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tcard-meta{display:flex;align-items:center;gap:6px}
.empty-drop{border:1.5px dashed #D2D2D7;border-radius:14px;padding:22px 12px;text-align:center;font-size:12.5px;color:var(--faint)}
.older-toggle{align-self:flex-start;background:#EDEDF0;border:none;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--muted)}

/* Sheets (popups) */
.backdrop{position:fixed;inset:0;background:rgba(29,29,31,.38);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
.backdrop.anim{animation:fade .15s ease-out}
.backdrop.top{z-index:300}
.sheet{background:#fff;border-radius:24px;width:100%;max-width:900px;max-height:calc(100vh - 48px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.35)}
.sheet.anim{animation:rise .2s ease-out}
.sheet.sm{max-width:460px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 22px 0}
.sheet-body{display:flex;flex:1;min-height:0;overflow:hidden}
.sheet-main{flex:1;min-width:0;padding:12px 22px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:20px}
.sheet-side{width:292px;flex-shrink:0;background:#F7F7F9;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;border-left:1px solid #EFEFF2}
.sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 22px;border-top:1px solid #EFEFF2}
.foot-r{display:flex;gap:10px;margin-left:auto}
.x{width:32px;height:32px;border-radius:999px;border:none;background:#EDEDF0;font-size:18px;line-height:1;color:var(--muted);flex-shrink:0}
.title-input{border:none;font-size:23px;font-weight:800;letter-spacing:-.02em;padding:4px 0;width:100%;outline:none;background:none}
.title-input::placeholder{color:#C7C7CC}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid #E4E4E7;background:#fff;border-radius:999px;padding:4px 12px 4px 4px;font-size:12.5px;font-weight:600}
.chip.on{border-color:var(--text);background:var(--text);color:#fff}
.chip .avatar{width:22px;height:22px;font-size:9px}
.chip.on .avatar{box-shadow:0 0 0 1.5px #fff}
.check-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F2F2F4;font-size:14px}
.check-item input{width:18px;height:18px;accent-color:var(--text);flex-shrink:0;margin:0}
.check-item .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.check-item .txt.done{text-decoration:line-through;color:var(--faint)}
.icon-btn{border:none;background:none;color:var(--faint);font-size:17px;line-height:1;padding:2px 6px}
.icon-btn:hover{color:var(--red)}
.add-row{display:flex;gap:8px;align-items:flex-start}
.comment{display:flex;gap:10px;align-items:flex-start}
.bubble{background:#F5F5F7;border-radius:14px;padding:9px 12px;font-size:13.5px;line-height:1.45;flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble-meta{font-size:11px;color:var(--faint);margin-bottom:3px;font-weight:600}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick a{display:inline-flex;align-items:center;gap:6px;background:#F0F6FE;color:var(--blue);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;text-decoration:none}
.quick a svg{width:14px;height:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.vseg{display:flex;flex-direction:column;gap:4px}
.vseg button{display:flex;align-items:center;gap:8px;border:1px solid #E4E4E7;background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;text-align:left}
.vseg button.on{background:var(--text);border-color:var(--text);color:#fff}
.vseg .dot{width:8px;height:8px;border-radius:999px;display:inline-block}
.day-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:#F7F7F9;border-radius:12px;padding:10px 12px;text-align:left;font-size:13.5px;font-weight:600}
.day-item:hover{background:#EFEFF2}
.confirm-body{padding:24px 22px 8px;font-size:15px;font-weight:600;line-height:1.45}

/* Calendar */
.cal{background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-head div{padding:10px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);background:#FAFAFB}
.cal-cell{min-height:116px;border:none;border-top:1px solid #F0F0F2;border-left:1px solid #F0F0F2;padding:8px;display:flex;flex-direction:column;gap:4px;background:#fff;text-align:left;align-items:stretch;min-width:0;cursor:pointer}
.cal-cell:nth-child(7n+1){border-left:none}
.cal-cell:hover{background:#FAFAFB}
.cal-cell.out{background:#FBFBFC;cursor:default}
.cal-date{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-size:12.5px;font-weight:700}
.cal-date.today{background:var(--accent);color:#fff}
.cal-pill{display:block;border:none;border-radius:8px;padding:3px 7px;font-size:10.5px;font-weight:700;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;cursor:pointer}
.cal-more{font-size:10.5px;color:var(--muted);font-weight:700;padding-left:4px}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.legend i{width:8px;height:8px;border-radius:999px;display:inline-block;margin-right:6px}

/* Calendar tools */
.cal-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cal-filters{display:flex;gap:8px;flex-wrap:wrap}
.cal-filter{display:inline-flex;align-items:center;gap:7px;border:1px solid #E4E4E7;background:#fff;border-radius:999px;padding:7px 14px 7px 11px;font-size:13px;font-weight:600;color:var(--faint)}
.cal-filter i{width:10px;height:10px;border-radius:999px;display:inline-block;opacity:.3}
.cal-filter b{font-weight:700;color:var(--faint);margin-left:2px}
.cal-filter.on{color:var(--text);border-color:#D2D2D7;box-shadow:var(--shadow)}
.cal-filter.on i{opacity:1}
.cal-pill.ev{background:#DCEEE0;color:#2F6B3E}
.cal-pill.mt{background:#FEE7E1;color:#C23A1E}
.cal-pill.cont{opacity:.7;border-radius:4px 8px 8px 4px}
.sheet.md{max-width:640px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.up-day{margin-bottom:18px}
.up-head{display:flex;align-items:baseline;gap:10px;margin:0 4px 8px;font-size:15px}
.up-row{grid-template-columns:4px 120px minmax(0,1fr) auto;gap:14px}
.up-bar{width:4px;height:34px;border-radius:2px}
.up-end{display:flex;align-items:center;gap:10px;justify-self:end}

/* Finance */
.fin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.fin-col{display:flex;flex-direction:column;gap:18px;min-width:0}
.fin-card{background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.fin-head{display:flex;justify-content:space-between;align-items:baseline;padding:16px 20px 10px}
.fin-head h3{margin:0;font-size:15px;font-weight:800}
.fin-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:11px 20px;border-top:1px solid #F2F2F4}
.fin-row .actions{display:flex;gap:12px}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.fin-add{display:grid;gap:8px;padding:14px 20px 16px;border-top:1px solid #EDEDF0;background:#FAFAFB}
.fin-add .grid-add{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px}

/* Team */
.team-row{display:flex;align-items:center;gap:18px;padding:16px 20px;background:#fff;border-radius:20px;box-shadow:var(--shadow)}
.team-id{display:flex;align-items:center;gap:12px;width:210px;flex-shrink:0;min-width:0}
.stat{background:var(--bg);border-radius:12px;padding:8px 14px;text-align:center;min-width:64px}
.stat b{display:block;font-size:17px;font-weight:800}
.stat span{font-size:10px;color:var(--faint);font-weight:600}
.vr{height:40px;width:1px;background:#EEEEF0;flex-shrink:0}
.team-tasks{display:flex;gap:10px;flex:1;min-width:0;overflow:hidden}
.mini-task{background:var(--bg);border:none;border-radius:12px;padding:9px 12px;width:156px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;text-align:left}
.mini-task:hover{background:#EDEDF0}

/* Login and states */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:24px;padding:34px;width:100%;max-width:370px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.login-logo{width:34px;height:auto}
.err-text{color:var(--red);font-size:13px;font-weight:600;min-height:1em}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px;text-align:center}
.spinner{width:28px;height:28px;border-radius:999px;border:3px solid #E4E4E7;border-top-color:var(--blue);animation:spin .8s linear infinite}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,10px);background:var(--side);color:#fff;border-radius:999px;padding:11px 20px;font-size:13px;font-weight:600;z-index:400;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--red)}

@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:1100px){
  .tiles,.people-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .team-tasks{display:none}
}
@media (min-width:768px) and (max-width:1000px){
  .sidebar{width:200px;padding:20px 10px}
  .main{padding:24px 22px 48px}
  .board{display:flex;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px}
  .board .col{flex:1 0 250px;min-width:250px;scroll-snap-align:start}
  .sheet-body{flex-direction:column;overflow-y:auto}
  .sheet-main,.sheet-side{overflow:visible}
  .sheet-side{width:100%;border-left:none;border-top:1px solid #EFEFF2}
  .fin-grid{grid-template-columns:1fr}
  .dl-row{grid-template-columns:110px minmax(0,1fr) 90px 96px}
  .cal-cell{min-height:92px}
}

/* ================= iPhone ================= */
:root{--tint:#1C6FE0;--m2:rgba(60,60,67,.6);--m3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.29);--ired:#FF3B30;--igreen:#34C759;--iorange:#FF9500;--gbg:#F2F2F7}
@media (max-width:767px){
  html{background:var(--gbg);touch-action:manipulation}
  body{background:var(--gbg);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Manrope',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  body.m-lock{overflow:hidden}
  input,select,textarea,.inp{font-size:16px!important}
  .toast{bottom:auto;top:calc(env(safe-area-inset-top) + 8px);transform:translate(-50%,-14px);border-radius:14px;background:rgba(29,29,31,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding:12px 18px;font-size:15px}
  .toast.show{transform:translate(-50%,0)}
  .toast.err{background:rgba(255,59,48,.95)}
  .login{align-items:flex-start;padding-top:calc(env(safe-area-inset-top) + 64px)}
  .login-card{box-shadow:none;background:transparent;padding:16px;gap:18px}
  .login-logo{width:48px}
  .login .h1{font-size:30px}
  .login .inp{background:#fff;border-color:transparent;border-radius:12px;padding:13px 14px}
  .login .btn{padding:15px;font-size:17px;border-radius:14px;background:var(--tint)}
  .center .btn{border-radius:14px}
}
.m-app{min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom));color:#000}
.m-app button{-webkit-user-select:none;user-select:none}
[data-lp]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

/* Navigation bar */
.m-nav{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;min-height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 6px 0;background:rgba(242,242,247,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;transition:border-color .2s,background-color .2s}
.m-nav.scrolled{border-bottom-color:var(--sep);background:rgba(249,249,249,.86)}
.m-nav-title{font-size:17px;font-weight:600;letter-spacing:-.4px;opacity:0;transition:opacity .18s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw;text-align:center}
.m-nav.scrolled .m-nav-title{opacity:1}
.m-nav-side{display:flex;align-items:center;min-width:0}
.m-nav-side.r{justify-content:flex-end}
.m-back{display:flex;align-items:center;border:none;background:none;color:var(--tint);font-size:17px;letter-spacing:-.4px;padding:10px 8px 10px 0;max-width:100%;min-height:44px}
.m-back svg{width:26px;height:26px;flex-shrink:0;margin-right:-1px}
.m-back:active,.m-icon-btn:active,.m-text-btn:active,.m-nbtn:active{opacity:.35}
.m-icon-btn{width:44px;height:44px;border:none;background:none;color:var(--tint);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.m-icon-btn svg{width:25px;height:25px}
.m-text-btn{border:none;background:none;color:var(--tint);font-size:17px;letter-spacing:-.4px;padding:10px 6px;min-height:44px}

/* Large titles */
.m-content{padding-bottom:12px;will-change:transform}
.m-large-wrap{padding:3px 16px 12px}
.m-large-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.m-large{margin:0;font-size:34px;font-weight:700;letter-spacing:.37px;line-height:1.2;overflow-wrap:anywhere}
.m-eyebrow{font-size:13px;font-weight:600;color:var(--m2);letter-spacing:-.08px;margin-bottom:1px}
.m-after{margin-top:6px}
.m-arrows{display:flex;margin-right:-10px}
.m-h2{margin:0;padding:26px 16px 10px;font-size:22px;font-weight:700;letter-spacing:.35px}

/* Grouped lists */
.m-ghead{padding:22px 32px 7px;font-size:13px;color:var(--m2);text-transform:uppercase;letter-spacing:-.08px;line-height:18px}
.m-ghead.red{color:var(--ired)}
.m-ghead.split{display:flex;justify-content:space-between;text-transform:none;font-size:13px}
.m-ghead.split span:first-child{text-transform:uppercase}

const pad = n => String(n).padStart(2,'0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dkey(new Date());
const mkey = (y,m) => { const d = new Date(y,m,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-01`; };
const thisMonth = () => { const n = new Date(); return mkey(n.getFullYear(), n.getMonth()); };
const shiftMonth = (k,n) => { const [y,m] = k.split('-').map(Number); return mkey(y, m-1+n); };
const monthLabel = k => { const [y,m] = k.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('en-ZA',{month:'long',year:'numeric'}); };
const parseDay = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WKD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const shortDate = d => `${d.getDate()} ${MON[d.getMonth()]}`;
const longDate = d => `${WKD[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
const fmtDate = ts => shortDate(new Date(ts));
const fmtDateTime = ts => { const d = new Date(ts); return `${shortDate(d)}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const money = n => { const v = Math.round(Number(n)||0); return (v<0?'-':'') + 'R' + Math.abs(v).toLocaleString('en-ZA'); };

function due(dateStr, status){
  if(status === 'complete') return {label:'Done', cls:'g'};
  if(!dateStr) return null;
  const t = today();
  if(dateStr < t) return {label:'Overdue', cls:'r'};
  if(dateStr === t) return {label:'Today', cls:'a'};
  const tm = new Date(); tm.setDate(tm.getDate()+1);
  if(dateStr === dkey(tm)) return {label:'Tomorrow', cls:'b'};
  const d = parseDay(dateStr); const start = new Date(); start.setHours(0,0,0,0);
  const diff = Math.round((d - start) / 864e5);
  return {label: diff < 7 ? WKD[d.getDay()] : shortDate(d), cls:'b'};
}
function ago(ts){
  if(!ts) return '';
  const d = new Date(ts); const start = new Date(); start.setHours(0,0,0,0);
  const days = Math.floor((start - new Date(d.getFullYear(),d.getMonth(),d.getDate())) / 864e5);
  if(days <= 0) return 'Today';
  if(days === 1) return 'Yesterday';
  if(days < 7) return `${days}d ago`;
  return fmtDate(ts);
}
// When a finished task was completed vs when it was due
function completion(t){
  if(!t || t.status !== 'complete' || !t.completed_at) return null;
  const doneKey = dkey(new Date(t.completed_at));
  const short = k => shortDate(parseDay(k));
  const long = k => longDate(parseDay(k));
  const out = { done:short(doneKey), doneLong:long(doneKey), due:null, dueLong:null, diff:0, tag:'No due date', cls:'n' };
  if(!t.due_date) return out;
  const diff = Math.round((parseDay(doneKey) - parseDay(t.due_date)) / 864e5);
  Object.assign(out, { due:short(t.due_date), dueLong:long(t.due_date), diff });
  if(diff > 0) Object.assign(out, { tag:`${plural(diff,'day')} late`, cls:'r' });
  else if(diff < 0) Object.assign(out, { tag:`${plural(-diff,'day')} early`, cls:'g' });
  else Object.assign(out, { tag:'On time', cls:'g' });
  return out;
}
function sortByDue(list){
  return [...list].sort((a,b) => {
    if(a.due_date && b.due_date) return a.due_date.localeCompare(b.due_date);
    if(a.due_date) return -1; if(b.due_date) return 1;
    return (b.created_at||'').localeCompare(a.created_at||'');
  });
}

let toastTimer;
function toast(msg, err){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = 'toast' + (err ? ' err' : ''); }, 2600);
}
async function db(q, okMsg){
  const { data, error } = await q;
  if(error){ console.error(error); toast(error.message, true); return null; }
  if(okMsg) toast(okMsg);
  return data ?? true;
}
function ask(msg, okLabel = 'Delete', danger = true){
  if(isMobile()) return actionSheet({ message:msg, actions:[{ label:okLabel, value:true, destructive:danger }] }).then(v => v === true);
  return new Promise(resolve => {
    const el = document.getElementById('confirm');
    el.innerHTML = `<div class="backdrop top anim"><div class="sheet sm anim" role="alertdialog" aria-modal="true">
      <div class="confirm-body">${esc(msg)}</div>
      <div class="sheet-foot" style="border:none"><div class="foot-r"><button class="btn btn-soft" id="c-no">Cancel</button><button class="btn ${danger?'btn-red':''}" id="c-yes">${esc(okLabel)}</button></div></div>
    </div></div>`;
    const done = v => { el.innerHTML = ''; resolve(v); };
    el.querySelector('#c-no').onclick = () => done(false);
    el.querySelector('#c-yes').onclick = () => done(true);
    el.querySelector('#c-yes').focus();
  });
}

/* ================= Data ================= */
async function loadAll(){
  const res = await Promise.all([
    sb.from('people').select('*').order('created_at').order('name'),
    sb.from('clients').select('*').order('name'),
    sb.from('tasks').select('*').eq('archived', false).order('created_at',{ascending:false}),
    sb.from('task_assignees').select('task_id, person_id, tasks!inner(archived)').eq('tasks.archived', false),
    sb.from('hit_list_leads').select('*').order('created_at',{ascending:false}),
    evQuery(evWindow().from, evWindow().to),
  ]);
  const failed = res.find(r => r.error);
  if(failed) toast(failed.error.message, true);
  [S.people, S.clients, S.tasks, S.assignees, S.leads, S.events] = res.map(r => r.data || []);
  S.evRange = evWindow();
  S.assignees = S.assignees.map(a => ({ task_id:a.task_id, person_id:a.person_id }));
  [...Object.values(S.archive), ...Object.values(S.calArch)].forEach(list => list.forEach(t => (t._assignees || []).forEach(pid => S.assignees.push({ task_id:t.id, person_id:pid }))));
  const weekAgoIso = new Date(Date.now() - 7*864e5).toISOString();
  const dw = await sb.from('tasks').select('id', { count:'exact', head:true }).eq('status','complete').gte('completed_at', weekAgoIso);
  S.doneWeekCount = dw.error ? null : dw.count;
  const sc = await sb.rpc('month_scores');
  S.scores = sc.error ? [] : (sc.data || []);
  const ORDER = ['Connor','Matt','Chantal','Mike'];
  S.people.sort((a,b) => (ORDER.indexOf(a.name)+99)%99 - (ORDER.indexOf(b.name)+99)%99 || a.name.localeCompare(b.name));
  S.me = S.people.find(p => p.auth_user_id === S.session?.user?.id) || null;
  if(isAdmin()){
    const fin = await Promise.all([
      sb.from('client_retainers').select('*').order('created_at'),
      sb.from('revenue_items').select('*').order('created_at'),
      sb.from('expenses').select('*').order('created_at'),
      sb.from('lead_values').select('*'),
    ]);
    [S.retainers, S.revenueItems, S.expenses] = fin.slice(0,3).map(r => r.data || []);
    S.leadValues = Object.fromEntries((fin[3].data || []).map(v => [v.lead_id, Number(v.monthly_value)]));
  } else { S.retainers = []; S.revenueItems = []; S.expenses = []; S.leadValues = {}; }
  S.loaded = true;
  const a = document.activeElement;
  if(a && $view.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) S.pendingRender = true;
  else renderView();
}

/* ================= Finance maths ================= */
function fin(k){
  const rets = S.retainers.filter(r => activeIn(r,k));
  const one = S.revenueItems.filter(r => r.month === k);
  const exps = S.expenses.filter(e => e.recurring ? activeIn(e,k) : e.start_month === k);
  const mrr = sum(rets, r => r.amount), projects = sum(one, r => r.amount), expenses = sum(exps, e => e.amount);
  const revenue = mrr + projects, profit = revenue - expenses;
  return { rets, one, exps, mrr, projects, expenses, revenue, profit, margin: revenue ? Math.round(profit / revenue * 100) : 0 };
}
const qualifiedLeads = () => S.leads.filter(l => l.stage === 'qualified');
const lv = id => S.leadValues[id] || 0;

function renderView(){
  if(S.booting){ $view.innerHTML = '<div class="center"><div class="spinner"></div></div>'; return; }
  if(!S.session){ $view.innerHTML = loginHTML(); return; }
  if(!S.loaded){ $view.innerHTML = '<div class="center"><div class="spinner"></div></div>'; return; }
  if(!S.me){ $view.innerHTML = notLinkedHTML(); return; }
  if(isMobile()){
    $view.innerHTML = `<div class="m-app">${mPageHTML()}${mTabs()}</div>`;
    S.navAnim = ''; S.calAnim = ''; updateNav();
    return;
  }
  $view.innerHTML = `<div class="layout">${sidebarHTML()}<main class="main">${pageHTML()}</main></div>`;
}
function renderModal(){
  const keep = [...$modal.querySelectorAll('.ks')].map(el => el.scrollTop);
  if(!S.modal){ $modal.innerHTML = ''; document.body.classList.remove('m-lock'); return; }
  const first = !S.modal._shown;
  $modal.innerHTML = modalHTML();
  S.modal._shown = true;
  if(!first) $modal.querySelectorAll('.ks').forEach((el,i) => { if(keep[i] != null) el.scrollTop = keep[i]; });
  $modal.querySelectorAll('textarea.grow').forEach(autoGrow);
  document.body.classList.toggle('m-lock', isMobile());
}
function dismissModal(){
  const current = S.modal, sh = $modal.querySelector('.m-sheet');
  if(sh && !reducedMotion()){
    sh.style.transition = 'transform .28s cubic-bezier(.4,0,.9,.6)'; sh.style.transform = 'translateY(105%)';
    $modal.querySelector('.m-sheet-wrap')?.classList.add('out');
    setTimeout(() => { if(S.modal === current){ S.modal = null; renderModal(); } }, 260);
  } else { S.modal = null; renderModal(); }
}

function pageHTML(){
  const r = S.route;
  if(r === 'dashboard') return pageDashboard();
  if(r === 'my-tasks') return pageBoard({ title:'My tasks', sub:'Everything assigned to you', tasks:S.tasks.filter(t => assigneeIds(t.id).includes(S.me.id)), preset:{person:S.me.id} });
  if(r === 'all-tasks') return pageBoard({ title:'All tasks', sub:'Every client, one board', tasks:S.tasks });
  if(r === 'archive') return pageArchive();
  if(r === 'projects') return pageBoard({ title:'Projects', sub:'Internal work that isn\'t tied to a client', tasks:S.tasks.filter(t => !t.client_id), showClient:false });
  if(r === 'hit-list') return pageHitList();
  if(r === 'calendar') return pageCalendar();
  if(r === 'team') return pageTeam();
  if(r === 'finance') return isAdmin() ? pageFinance() : '<div class="empty">Finance is only visible to admins.</div>';
  if(r.startsWith('client:')){
    const c = client(r.slice(7)); if(!c) return pageDashboard();
    let extra = '';
    if(isAdmin()){ const ret = S.retainers.find(x => x.client_id === c.id && activeIn(x, thisMonth())); if(ret) extra = `<span class="pill g">${money(ret.amount)} per month</span>`; }
    return pageBoard({ title:c.name, sub:'Client workspace', tasks:S.tasks.filter(t => t.client_id === c.id), preset:{client:c.id}, showClient:false, extra });
  }
  if(r.startsWith('member:')){
    const p = person(r.slice(7)); if(!p) return pageTeam();
    return pageBoard({ title:p.name, sub:p.role || '', tasks:S.tasks.filter(t => assigneeIds(t.id).includes(p.id)), preset:{person:p.id}, back:'team' });
  }
  return pageDashboard();
}

/* ---------- Task boards ---------- */
function taskCard(t, showClient){
  const c = client(t.client_id), ps = assigneesOf(t.id), d = due(t.due_date, t.status);
  const cl = Array.isArray(t.checklist) ? t.checklist : [];
  const top = (showClient ? clientPill(c) : '') + (t.priority === 'high' && t.status !== 'complete' ? '<span class="pill r">High</span>' : '');
  return `<div class="tcard ${t.status==='complete'?'done':''}" draggable="true" data-drag="task:${t.id}" data-action="open-task" data-id="${t.id}" tabindex="0">
    ${top ? `<div class="tcard-top">${top}</div>` : ''}
    <div class="tcard-title">${esc(t.title)}</div>
    ${t.description && t.status !== 'complete' ? `<div class="tcard-desc">${esc(t.description)}</div>` : ''}
    ${(() => { const cm = completion(t); return cm ? `<div class="done-meta"><span>Done <b>${cm.done}</b></span>${cm.due ? `<span>Due <b>${cm.due}</b></span>` : ''}</div>` : ''; })()}
    <div class="tcard-foot">${stack(ps)}<span class="tcard-meta">${t.status !== 'complete' && cl.length ? `<span class="mini" style="display:inline-flex;align-items:center;gap:3px">${ICON.check}${cl.filter(i=>i.done).length}/${cl.length}</span>` : ''}${(() => { const cm = completion(t); return cm ? `<span class="pill ${cm.cls}">${cm.tag}</span>` : duePill(d); })()}</span></div>
  </div>`;
}
function pageBoard({ title, sub, tasks, preset = {}, showClient = true, back = null, extra = '' }){
  const cutoff = new Date(Date.now() - 7*864e5).toISOString();
  const key = S.route;
  return `
  ${back ? `<button class="back" data-action="go" data-route="${back}">‹ Back to team</button>` : ''}
  <div class="page-head"><div><h1 class="h1">${esc(title)}</h1><p class="sub">${esc(sub)}</p></div>
    <div class="head-actions">${extra}<button class="btn" data-action="new-task" data-client="${preset.client||''}" data-person="${preset.person||''}">+ New task</button></div></div>
  <div class="board" style="--cols:3">
    ${TASK_COLS.map(([st,label]) => {
      let list = tasks.filter(x => x.status === st), older = [];
      if(st === 'complete'){
        list.sort((a,b) => (b.completed_at||'').localeCompare(a.completed_at||''));
        older = list.filter(x => x.completed_at && x.completed_at < cutoff);
        list = list.filter(x => !(x.completed_at && x.completed_at < cutoff));
      } else list = sortByDue(list);
      const showOld = S.showOlder[key];
      return `<div class="col" data-drop="task:${st}">
        <div class="col-head"><span class="col-title">${label}</span><span class="count">${list.length + older.length}</span></div>
        ${list.map(x => taskCard(x, showClient)).join('') || (older.length ? '' : '<div class="empty-drop">Drop tasks here</div>')}
        ${older.length ? `<button class="older-toggle" data-action="toggle-older">${showOld ? 'Hide' : 'Show'} ${older.length} earlier this month</button>${showOld ? older.map(x => taskCard(x, showClient)).join('') : ''}` : ''}
        ${st === 'complete' ? '<button class="older-toggle" data-action="go" data-route="archive">View archive</button>' : ''}
      </div>`;
    }).join('')}
  </div>`;
}

/* ---------- Calendar ---------- */
const CAL_KINDS = {
  task:    { label:'Tasks',    dot:'#1C6FE0', bg:'#E4EFFC', fg:'#1C6FE0' },
  meeting: { label:'Meetings', dot:'#F04A2B', bg:'#FEE7E1', fg:'#C23A1E' },
  event:   { label:'Events',   dot:'#34A853', bg:'#DCEEE0', fg:'#2F6B3E' },
};
const CAL_FILTER_KEY = 'fw-cal-filter';
function loadCalFilter(){
  try { return { task:true, meeting:true, event:true, ...JSON.parse(localStorage.getItem(CAL_FILTER_KEY) || '{}') }; }
  catch(e){ return { task:true, meeting:true, event:true }; }
}
function saveCalFilter(){ try { localStorage.setItem(CAL_FILTER_KEY, JSON.stringify(S.calFilter)); } catch(e){} }
const addDaysKey = (k, n) => { const d = parseDay(k); d.setDate(d.getDate() + n); return dkey(d); };

// Only the months around what you're looking at are loaded, so the calendar stays fast forever.
function evWindow(){
  const vm = mkey(S.cal.y, S.cal.m), cur = thisMonth();
  const keys = [shiftMonth(vm,-1), vm, shiftMonth(vm,1), cur, shiftMonth(cur,1)].sort();
  return { from:keys[0], to:shiftMonth(keys[keys.length-1], 1) };
}
const evQuery = (from, to) => sb.from('calendar_events').select('*').gte('event_date', addDaysKey(from, -31)).lt('event_date', to).order('event_date');
async function ensureCalData(){
  if(S.calFetching) return;
  const w = evWindow(), jobs = [];
  if(!S.evRange || w.from < S.evRange.from || w.to > S.evRange.to){
    const from = S.evRange && S.evRange.from < w.from ? S.evRange.from : w.from;
    const to = S.evRange && S.evRange.to > w.to ? S.evRange.to : w.to;
    jobs.push(evQuery(from, to).then(r => { if(!r.error){ S.events = r.data || []; S.evRange = { from, to }; } }));
  }
  const vm = mkey(S.cal.y, S.cal.m);
  [shiftMonth(vm,-1), vm, shiftMonth(vm,1)].forEach(mk => {
    if(S.calArch[mk]) return;
    S.calArch[mk] = [];
    jobs.push(sb.from('tasks').select('*').eq('archived', true).gte('due_date', mk).lt('due_date', shiftMonth(mk,1)).then(async r => {
      const list = r.data || [];
      if(list.length){
        const { data:as } = await sb.from('task_assignees').select('task_id, person_id').in('task_id', list.map(t => t.id));
        list.forEach(t => { t._assignees = (as || []).filter(a => a.task_id === t.id).map(a => a.person_id); });
        const have = new Set(S.assignees.map(a => a.task_id + a.person_id));
        (as || []).forEach(a => { if(!have.has(a.task_id + a.person_id)) S.assignees.push(a); });
      }
      S.calArch[mk] = list;
    }));
  });
  if(!jobs.length) return;
  S.calFetching = true;
  await Promise.all(jobs);
  S.calFetching = false;
  if(S.route === 'calendar') renderView();
}

const evCovers = (e, k) => e.event_date === k || (!!e.end_date && e.event_date <= k && e.end_date >= k);
const evMultiDay = e => !!e.end_date && e.end_date !== e.event_date;
function evWhen(e, k){
  if(e.kind === 'event' && (e.all_day || !e.event_time)){
    if(evMultiDay(e) && k) return `Day ${Math.round((parseDay(k) - parseDay(e.event_date)) / 864e5) + 1} of ${Math.round((parseDay(e.end_date) - parseDay(e.event_date)) / 864e5) + 1}`;
    return 'All day';
  }
  return `${timeLabel(e.event_time)}${e.end_time ? ' to ' + timeLabel(e.end_time) : ''}`;
}
const evPeople = e => (e.attendee_ids || []).map(person).filter(Boolean);
function calTasksForDay(k){
  const mk = k.slice(0,7) + '-01';
  return [...S.tasks.filter(t => t.due_date === k), ...(S.calArch[mk] || []).filter(t => t.due_date === k)];
}
function dayItems(k, all){
  const f = all ? { task:true, meeting:true, event:true } : S.calFilter;
  const byTime = (a,b) => (a.event_time || '').localeCompare(b.event_time || '');
  const evs = f.event ? S.events.filter(e => e.kind === 'event' && evCovers(e,k)).sort((a,b) => (b.all_day - a.all_day) || byTime(a,b)) : [];
  const mts = f.meeting ? S.events.filter(e => e.kind === 'meeting' && e.event_date === k).sort(byTime) : [];
  const tk = f.task ? calTasksForDay(k) : [];
  return { evs, mts, tk, count:evs.length + mts.length + tk.length };
}
function monthCounts(){
  const y = S.cal.y, m = S.cal.m, days = new Date(y, m+1, 0).getDate();
  const ev = new Set(), mt = new Set(); let tk = 0;
  for(let d = 1; d <= days; d++){
    const k = `${y}-${pad(m+1)}-${pad(d)}`;
    S.events.forEach(e => { if(e.kind === 'event' && evCovers(e,k)) ev.add(e.id); if(e.kind === 'meeting' && e.event_date === k) mt.add(e.id); });
    tk += calTasksForDay(k).length;
  }
  return { task:tk, meeting:mt.size, event:ev.size };
}
function dayLabel(k){
  const t = today(), tm = addDaysKey(t, 1);
  return (k === t ? 'Today, ' : k === tm ? 'Tomorrow, ' : '') + parseDay(k).toLocaleDateString('en-ZA', { weekday:'long' }) + ' ' + shortDate(parseDay(k));
}

  return `<span class="cal-pill ${type === 'meeting' ? 'mt' : 'ev'} ${cont ? 'cont' : ''}" data-action="open-event" data-id="${item.id}" title="${esc(item.title)}">${cont ? '' : time}${esc(item.title)}</span>`;

function openEvent(id, preset = {}){

    kind, title:e.title, event_date:e.event_date, end_date:e.end_date || '', event_time:timeLabel(e.event_time), end_time:timeLabel(e.end_time),

  } : { kind, title:'', event_date:preset.date || today(), end_date:'', event_time:'', end_time:'', all_day:kind === 'event', location:'', notes:'', assignees:[S.me.id] };

async function saveEvent(){
  const m = S.modal, d = m.draft, meeting = d.kind === 'meeting';
  if(!d.title.trim()) return toast('Give it a name first', true);
  if(!d.event_date) return toast('Pick a date', true);
  if(meeting && !d.event_time) return toast('Pick a start time so we can send the reminder', true);
  const multi = !meeting && d.end_date && d.end_date !== d.event_date;
  if(multi && d.end_date < d.event_date) return toast('The end date is before the start date', true);
  const timed = meeting || !d.all_day;
  if(timed && d.event_time && d.end_time && !multi && d.end_time <= d.event_time) return toast('The end time is before the start time', true);
  const row = {
    kind:d.kind, title:d.title.trim(), event_date:d.event_date, end_date:multi ? d.end_date : null,
    all_day:!meeting && (d.all_day || !d.event_time), event_time:timed && d.event_time ? d.event_time : null, end_time:timed && d.end_time ? d.end_time : null,
    location:d.location.trim() || null, notes:d.notes.trim() || null, attendee_ids:d.assignees,
  };
  if(m.id){ if(!(await db(sb.from('calendar_events').update(row).eq('id', m.id)))) return; }
  else { row.created_by = S.me.id; if(!(await db(sb.from('calendar_events').insert(row)))) return; }
  dismissModal(); toast(m.id ? 'Saved' : meeting ? 'Meeting added. Reminder set for 30 minutes before.' : 'Added to calendar'); loadAll();
}
async function deleteEvent(){
  const e = S.events.find(x => x.id === S.modal.id);
  if(!(await ask(`Delete ${e ? '"' + e.title + '"' : 'this entry'}?`))) return;
  if(!(await db(sb.from('calendar_events').delete().eq('id', S.modal.id)))) return;
  dismissModal(); toast('Deleted'); loadAll();
}

/* ---------- Monthly leaderboard ---------- */
function leaderboard(){
  const list = S.people.map(p => ({ p, n:(S.scores.find(s => s.person_id === p.id) || {}).completed || 0 }))
    .sort((a,b) => b.n - a.n || a.p.name.localeCompare(b.p.name));
  let rank = 0, prev = -1;
  list.forEach((r,i) => { if(r.n !== prev){ rank = i + 1; prev = r.n; } r.rank = rank; });
  const top = list[0] ? list[0].n : 0;
  const leaders = list.filter(r => r.n === top && top > 0);
  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
  const teamDone = S.tasks.filter(t => t.status === 'complete' && t.completed_at && new Date(t.completed_at) >= monthStart).length;
  const mine = list.find(r => r.p.id === S.me.id);
  let gap = '';
  if(mine){
    if(!top) gap = 'Nobody has scored yet this month. First tick takes the lead.';
    else if(mine.n === top) gap = leaders.length > 1 ? `You're tied for 1st with ${mine.n}.` : `You're leading by ${top - (list.find(r => r.n < top) || { n:0 }).n}.`;
    else gap = `You're ${top - mine.n} behind ${leaders[0].p.name}.`;
  }
  const now = new Date();
  const month = now.toLocaleDateString('en-ZA', { month:'long' });
  const resets = new Date(now.getFullYear(), now.getMonth() + 1, 1).toLocaleDateString('en-ZA', { day:'numeric', month:'long' });
  return { list, top, leaders, teamDone, gap, month, resets };
}
function leaderboardHTML(){
  const b = leaderboard();
  return `<section>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px">

/* ---------- Archive ---------- */
const archMonthKey = () => S.archMonth || shiftMonth(thisMonth(), -1);
const saBoundary = k => k + 'T00:00:00+02:00';
async function loadArchive(k){
  if(S.archLoading === k) return;
  S.archLoading = k;
  const { data, error } = await sb.from('tasks').select('*').eq('archived', true)
    .gte('completed_at', saBoundary(k)).lt('completed_at', saBoundary(shiftMonth(k,1))).order('completed_at', { ascending:false });
  if(error){ toast(error.message, true); S.archLoading = null; return; }
  const list = data || [];
  if(list.length){
    const { data:as } = await sb.from('task_assignees').select('task_id, person_id').in('task_id', list.map(t => t.id));
    list.forEach(t => { t._assignees = (as || []).filter(a => a.task_id === t.id).map(a => a.person_id); });
    const have = new Set(S.assignees.map(a => a.task_id + a.person_id));
    (as || []).forEach(a => { if(!have.has(a.task_id + a.person_id)) S.assignees.push(a); });
  }
  S.archive[k] = list; S.archLoading = null;
  if(S.route === 'archive') renderView();
}
function archiveFiltered(k){
  const q = S.archQuery.trim().toLowerCase(), list = S.archive[k] || [];
  if(!q) return list;
  return list.filter(t => [t.title, t.description, client(t.client_id)?.name, ...assigneesOf(t.id).map(p => p.name)].filter(Boolean).join(' ').toLowerCase().includes(q));
}
function archiveGroups(list){
  const groups = {};
  list.forEach(t => { const key = t.client_id || '_internal'; (groups[key] = groups[key] || []).push(t); });
  return Object.entries(groups).sort((a,b) => b[1].length - a[1].length);
}

  const k = archMonthKey();

  if(!list.length) return `<div class="empty">No archived tasks in ${monthLabel(k)} match "${esc(S.archQuery)}".</div>`;

      ${tasks.map(t => { const cm = completion(t) || {}; return `<button class="row arch-row" data-action="open-task" data-id="${t.id}">

    </div>`).join('');

async function saveTask(){
  const m = S.modal, d = m.draft;
  if(!d.title.trim()){ toast('Give the task a name first', true); return; }
  const prev = m.id ? findTask(m.id) : null;
  const row = { title:d.title.trim(), description:d.description.trim() || null, status:d.status, priority:d.priority,
    client_id:d.client_id || null, due_date:d.due_date || null, checklist:d.checklist, updated_at:new Date().toISOString() };
  if(d.status === 'complete'){ if(!prev || prev.status !== 'complete') row.completed_at = new Date().toISOString(); }
  else { row.completed_at = null; row.archived = false; }
  let id = m.id;
  if(id){ if(!(await db(sb.from('tasks').update(row).eq('id', id)))) return; }
  else {
    row.created_by = S.me.id;
    const r = await db(sb.from('tasks').insert(row).select().single()); if(!r) return; id = r.id;
  }
  if(m.id && !(await db(sb.from('task_assignees').delete().eq('task_id', id)))) return;
  if(d.assignees.length && !(await db(sb.from('task_assignees').insert(d.assignees.map(p => ({ task_id:id, person_id:p })))))) return;
  S.archive = {}; dismissModal(); toast(m.id ? 'Task saved' : 'Task created'); loadAll();
}
async function deleteTask(){
  const t = findTask(S.modal.id);
  if(!(await ask(`Delete "${t?.title || 'this task'}"? This can't be undone.`))) return;
  if(!(await db(sb.from('tasks').delete().eq('id', S.modal.id)))) return;
  S.archive = {}; dismissModal(); toast('Task deleted'); loadAll();
}
async function addComment(){
  const m = S.modal, body = (m.comment || '').trim(); if(!body) return;
  if(!(await db(sb.from('task_comments').insert({ task_id:m.id, author_id:S.me.id, body })))) return;
  m.comment = ''; loadComments(m.id);
}
async function saveLead(){
  const m = S.modal, d = m.draft;
  if(!d.business_name.trim()){ toast('Add the business name first', true); return; }
  const prev = m.id ? S.leads.find(x => x.id === m.id) : null;
  const row = { business_name:d.business_name.trim(), contact_name:d.contact_name.trim() || null, phone:d.phone.trim() || null,
    email:d.email.trim() || null, website:d.website.trim() || null, stage:d.stage, owner_id:d.owner_id || null, details:d.details.trim() || null };
  if(!prev || prev.stage !== d.stage) row.stage_changed_at = new Date().toISOString();
  if(prev && prev.stage === 'won' && d.stage !== 'won' && !(await confirmUnwin(prev))) return;
  const raw = d.monthly_value === '' || d.monthly_value === null ? null : Number(d.monthly_value);
  const value = Number.isFinite(raw) && raw > 0 ? raw : null;
  const saveValue = async id => {
    if(!isAdmin() || value === (S.leadValues[id] ?? null)) return true;
    return value === null
      ? db(sb.from('lead_values').delete().eq('lead_id', id))
      : db(sb.from('lead_values').upsert({ lead_id:id, monthly_value:value, updated_at:new Date().toISOString() }));
  };
  let id = m.id;
  if(id){
    if(!(await saveValue(id))) return;
    if(!(await db(sb.from('hit_list_leads').update(row).eq('id', id)))) return;
  } else {
    const r = await db(sb.from('hit_list_leads').insert(row).select().single()); if(!r) return; id = r.id;
    if(!(await saveValue(id))) return;
  }
  dismissModal();
  const becameClient = d.stage === 'won' && (!prev || prev.stage !== 'won');
  toast(becameClient ? `${row.business_name} is now a client` : m.id ? 'Lead saved' : 'Lead added');
  loadAll();
}

const finMonth = () => S.finMonth || thisMonth();
const finList = table => table === 'client_retainers' ? S.retainers : table === 'expenses' ? S.expenses : S.revenueItems;
function finLabel(table, row){ return table === 'client_retainers' ? (client(row.client_id)?.name || 'Retainer') : (row.category || row.description); }
async function finChange(table, id, amount){
  const k = finMonth(), row = finList(table).find(r => r.id === id); if(!row) return;
  if(row.start_month >= k){ if(!(await db(sb.from(table).update({ amount }).eq('id', id)))) return; }
  else {
    const { id:_i, created_at:_c, ...rest } = row;
    if(!(await db(sb.from(table).update({ end_month:shiftMonth(k,-1) }).eq('id', id)))) return;
    if(!(await db(sb.from(table).insert({ ...rest, amount, start_month:k })))) return;
  }
  toast('Amount updated'); loadAll();
}
async function finStop(table, id, skipAsk){
  const k = finMonth(), row = finList(table).find(r => r.id === id); if(!row) return;
  if(!skipAsk && !(await ask(`Stop ${finLabel(table,row)} from ${monthLabel(k)}? Earlier months stay as they are.`, 'Stop'))) return;
  const q = row.start_month >= k ? sb.from(table).delete().eq('id', id) : sb.from(table).update({ end_month:shiftMonth(k,-1) }).eq('id', id);
  if(await db(q, 'Stopped')) loadAll();
}

function ancestry(r){

  if(r.startsWith('client:') || ['team','projects','finance','archive'].includes(r)) return ['more'];

}
function tabOf(r){

  if(root === 'dashboard') return 'home';
  if(root === 'my-tasks' || root === 'all-tasks') return 'tasks';
  if(root === 'hit-list') return 'leads';

  if(r === 'dashboard') return 'Home';

/* ---------- Navigation stack ---------- */
function setHash(r, push){
  const h = '#' + encodeURIComponent(r);
  if(push) history.pushState(null, '', h); else history.replaceState(null, '', h);
}
function go(route, mode){
  if(!isMobile()){ S.route = route; location.hash = encodeURIComponent(route); renderView(); window.scrollTo(0,0); return; }
  if(route === S.route && mode !== 'tab') return;
  S.scroll[S.route] = window.scrollY;
  mode = mode || (ROOTS.has(route) ? 'tab' : 'push');
  if(mode === 'push'){ S.stack.push(S.route); S.navAnim = 'nav-push'; setHash(route, true); S.histDepth++; }
  else if(mode === 'tab'){ S.stack = []; S.navAnim = 'nav-fade'; setHash(route, false); S.histDepth = 0; }
  else { S.navAnim = ''; setHash(route, false); }
  S.route = route; renderView(); window.scrollTo(0,0);
}
function popTo(r){
  S.stack.pop();
  S.navAnim = S.skipAnim ? '' : 'nav-pop'; S.skipAnim = false;
  S.route = r; renderView(); window.scrollTo(0, S.scroll[r] || 0);
}
function back(){
  if(!S.stack.length) return;
  if(S.histDepth > 0){ history.back(); return; }
  const r = S.stack[S.stack.length - 1]; setHash(r, false); popTo(r);
}
window.addEventListener('popstate', () => {
  if(!isMobile()) return;
  const r = decodeURIComponent(location.hash.slice(1)) || 'dashboard';
  if(S.stack.length && S.stack[S.stack.length - 1] === r){ S.histDepth = Math.max(0, S.histDepth - 1); popTo(r); }
  else if(r !== S.route){ S.stack = ancestry(r); S.histDepth = 0; S.route = r; S.navAnim = 'nav-fade'; renderView(); window.scrollTo(0,0); }
});

    !done && cl.length ? `<span>${cl.filter(i => i.done).length}/${cl.length}</span>` : '',

function dueBucket(t){
  if(!t.due_date) return 'No date';
  const td = today(); if(t.due_date < td) return 'Overdue'; if(t.due_date === td) return 'Today';
  const a = new Date(); a.setDate(a.getDate() + 1); if(t.due_date === dkey(a)) return 'Tomorrow';
  const w = new Date(); w.setDate(w.getDate() + 7); if(t.due_date <= dkey(w)) return 'Next 7 days';
  return 'Later';
}
const BUCKETS = ['Overdue','Today','Tomorrow','Next 7 days','Later','No date'];
function mTaskList(tasks, key, { showClient = true } = {}){
  const filter = (key === 'all-tasks' || key === 'my-tasks') ? S.mFilter : null;
  if(filter){
    const t0 = today();
    const list = sortByDue(tasks.filter(x => x.status !== 'complete' && (filter === 'today' ? x.due_date === t0 : x.due_date && x.due_date < t0)));
    return `<button class="m-filter" data-action="m-clear-filter" aria-label="Clear filter">${filter === 'today' ? 'Due today' : 'Overdue'}${I.x}</button>`
      + (list.length ? `<div class="m-group">${list.map(x => mTaskRow(x, showClient)).join('')}</div>` : mEmpty('All clear', filter === 'today' ? 'Nothing is due today.' : 'Nothing is overdue.'));
  }
  const st = S.mStatus[key] || 'open';
  const count = s => tasks.filter(x => x.status === s).length;
  const seg = `<div class="m-seg-wrap"><div class="m-seg" role="tablist">${TASK_COLS.map(([v,l]) => `<button role="tab" aria-selected="${v===st}" class="${v===st?'on':''}" data-action="m-status" data-key="${esc(key)}" data-v="${v}">${v === 'complete' ? 'Done' : l}${v !== 'complete' && count(v) ? `<span class="m-segn">${count(v)}</span>` : ''}</button>`).join('')}</div></div>`;
  let list = tasks.filter(x => x.status === st), out = '';
  if(st === 'complete'){
    list.sort((a,b) => (b.completed_at||'').localeCompare(a.completed_at||''));
    const cutoff = new Date(Date.now() - 7*864e5).toISOString();
    const recent = list.filter(x => !(x.completed_at && x.completed_at < cutoff)), older = list.filter(x => x.completed_at && x.completed_at < cutoff);
    const showOld = S.showOlder[key];
    if(recent.length) out += `<div class="m-ghead">Last 7 days</div><div class="m-group">${recent.map(x => mTaskRow(x, showClient)).join('')}</div>`;
    if(older.length) out += `<div class="m-ghead">Earlier this month</div><div class="m-group">${showOld ? older.map(x => mTaskRow(x, showClient)).join('') : ''}<button class="m-row tap m-link-row" data-action="toggle-older">${showOld ? 'Hide' : 'Show'} ${plural(older.length,'task')}</button></div>`;
    if(!list.length) out = mEmpty('Nothing done yet this month', 'Tap the circle on a task to complete it.');
    out += '<div class="m-group m-gap"><button class="m-row tap m-link-row" data-action="go" data-route="archive">View archive</button></div><div class="m-gfoot">Completed tasks move to the archive on the 1st of each month.</div>';
  } else {
    const groups = {};
    sortByDue(list).forEach(x => { (groups[dueBucket(x)] = groups[dueBucket(x)] || []).push(x); });
    out = BUCKETS.filter(b => groups[b]).map(b => `<div class="m-ghead ${b==='Overdue'?'red':''}">${b}</div><div class="m-group">${groups[b].map(x => mTaskRow(x, showClient)).join('')}</div>`).join('');
    if(!list.length) out = mEmpty(st === 'open' ? 'No open tasks' : 'Nothing in progress', st === 'open' ? 'Tap + to add a task.' : 'Long-press a task to move it here.');
  }
  return seg + out;
}

function actionSheet({ title = '', message = '', actions }){
  return new Promise(resolve => {
    const el = document.getElementById('confirm');
    el.innerHTML = `<div class="m-as-wrap" data-as="cancel"><div class="m-as" data-as="none" role="dialog" aria-modal="true">
      <div class="m-as-group">${title || message ? `<div class="m-as-head">${title ? `<b>${esc(title)}</b>` : ''}${message ? `<span>${esc(message)}</span>` : ''}</div>` : ''}
      ${actions.map((a,i) => `<button class="m-as-btn ${a.destructive?'red':''}" data-as="${i}">${a.checked ? `<span class="m-as-check">${I.tick}</span>` : ''}${esc(a.label)}</button>`).join('')}</div>
      <button class="m-as-btn m-as-cancel" data-as="cancel">Cancel</button></div></div>`;
    const finish = v => { const w = el.querySelector('.m-as-wrap'); if(w) w.classList.add('out'); el.onclick = null; setTimeout(() => { el.innerHTML = ''; resolve(v); }, reducedMotion() ? 0 : 180); };
    el.onclick = e => {
      const b = e.target.closest('[data-as]'); if(!b || b.dataset.as === 'none') return;
      finish(b.dataset.as === 'cancel' ? null : actions[+b.dataset.as].value);
    };
  });
}

/* ---------- Status changes shared by drag, menus and checkmarks ---------- */
async function setTaskStatus(id, target, delay = 0){
  const t = S.tasks.find(x => x.id === id); if(!t || t.status === target) return;
  const now = new Date().toISOString();
  const patch = { status:target, updated_at:now, completed_at: target === 'complete' ? now : null };
  if(target !== 'complete') patch.archived = false;
  Object.assign(t, patch);
  if(delay) setTimeout(renderView, delay); else renderView();
  if(await db(sb.from('tasks').update(patch).eq('id', id))){ if(target === 'complete') toast('Nice, task done'); }
  else loadAll();
}
async function setLeadStage(id, target){
  const l = S.leads.find(x => x.id === id); if(!l || l.stage === target) return;
  if(l.stage === 'won' && !(await confirmUnwin(l))) return;
  const patch = { stage:target, stage_changed_at:new Date().toISOString() };
  Object.assign(l, patch); renderView();
  if(!(await db(sb.from('hit_list_leads').update(patch).eq('id', id)))){ loadAll(); return; }
  if(target === 'won') toast(isAdmin() && !lv(id) ? `${l.business_name} is now a client. Add its monthly value to count it in revenue.` : `${l.business_name} is now a client`);
  else if(target === 'qualified' && isAdmin() && !lv(id)) toast('Qualified. Open the lead to set its monthly value.');
  loadAll();
}

/* ---------- Touch gestures ---------- */
let lp = null, drag = null, swipe = null, suppressClickUntil = 0;
function autoGrow(el){ el.style.height = 'auto'; el.style.height = Math.max(el.scrollHeight, 24) + 'px'; }
function snapSheet(){ const sh = $modal.querySelector('.m-sheet'); if(sh){ sh.style.transition = 'transform .32s cubic-bezier(.2,.9,.25,1)'; sh.style.transform = ''; } }
document.addEventListener('touchstart', e => {
  if(!isMobile()) return;
  const t = e.touches[0];
  const held = e.target.closest('[data-lp]');
  if(held && !e.target.closest('.m-check, a')){
    lp = { el:held, x:t.clientX, y:t.clientY, fired:false };
    lp.timer = setTimeout(() => {
      if(!lp) return;
      lp.fired = true; suppressClickUntil = Date.now() + 700;
      held.classList.add('m-held'); setTimeout(() => held.classList.remove('m-held'), 260);
      if(held.dataset.lp === 'task') taskMenu(held.dataset.id); else if(held.dataset.lp === 'lead') leadMenu(held.dataset.id);
    }, 450);
  }
  const grab = e.target.closest('.m-grab-area');
  if(grab && !e.target.closest('button')){
    const sheet = grab.closest('.m-sheet');
    drag = { type:'sheet', y0:t.clientY, t0:Date.now(), dy:0, sheet }; sheet.style.transition = 'none';
  } else if(isStandalone() && S.stack.length && !S.modal && t.clientX < 24){
    const content = document.querySelector('.m-content');
    if(content) drag = { type:'edge', x0:t.clientX, t0:Date.now(), dx:0, content };
  }
  if(e.target.closest('#m-cal')) swipe = { x0:t.clientX, y0:t.clientY };
}, { passive:true });
document.addEventListener('touchmove', e => {
  if(!isMobile()) return;
  const t = e.touches[0];
  if(lp && (Math.abs(t.clientX - lp.x) > 10 || Math.abs(t.clientY - lp.y) > 10)){ clearTimeout(lp.timer); lp = null; }
  if(drag?.type === 'sheet'){ drag.dy = Math.max(0, t.clientY - drag.y0); drag.sheet.style.transform = `translateY(${drag.dy}px)`; }
  if(drag?.type === 'edge'){ drag.dx = Math.max(0, t.clientX - drag.x0); drag.content.style.transition = 'none'; drag.content.style.transform = `translateX(${drag.dx}px)`; }
}, { passive:true });
document.addEventListener('touchend', e => {
  if(!isMobile()) return;
  if(lp){ clearTimeout(lp.timer); if(lp.fired && e.cancelable) e.preventDefault(); lp = null; }
  if(drag?.type === 'sheet'){
    const { dy, t0 } = drag; drag = null;
    const v = dy / Math.max(1, Date.now() - t0);
    if(dy > 120 || (v > 0.6 && dy > 30)) closeModal(); else snapSheet();
  } else if(drag?.type === 'edge'){
    const { dx, t0, content } = drag; drag = null;
    const v = dx / Math.max(1, Date.now() - t0);
    if(dx > window.innerWidth * 0.3 || (v > 0.5 && dx > 40)){
      content.style.transition = 'transform .2s ease-out'; content.style.transform = 'translateX(100%)';
      setTimeout(() => { S.skipAnim = true; back(); }, 190);
    } else { content.style.transition = 'transform .25s cubic-bezier(.2,.9,.25,1)'; content.style.transform = ''; }
  }
  if(swipe){
    const t = e.changedTouches[0], dx = t.clientX - swipe.x0, dy = t.clientY - swipe.y0; swipe = null;
    if(Math.abs(dx) > 50 && Math.abs(dy) < 40){
      S.cal.m += dx < 0 ? 1 : -1;
      if(S.cal.m > 11){ S.cal.m = 0; S.cal.y++; } if(S.cal.m < 0){ S.cal.m = 11; S.cal.y--; }
      S.calSel = null; S.calAnim = dx < 0 ? 'cal-next' : 'cal-prev'; renderView();
    }
  }
}, { passive:false });
document.addEventListener('touchcancel', () => { if(lp){ clearTimeout(lp.timer); lp = null; } if(drag?.type === 'sheet') snapSheet(); drag = null; swipe = null; });
document.addEventListener('contextmenu', e => { if(isMobile() && e.target.closest('[data-lp]')) e.preventDefault(); });

/* ================= Events ================= */
document.addEventListener('click', async e => {
  if(Date.now() < suppressClickUntil){ e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const link = e.target.closest('a[href]');
  if(link && !link.hasAttribute('data-action')) return;
  const a = el.dataset.action, d = el.dataset, m = S.modal;
  switch(a){
    case 'noop': return;
    case 'go': go(d.route); break;
    case 'back': back(); break;
    case 'tab': {
      const root = tabRoot(d.tab);
      if(tabOf(S.route) === d.tab){ if(S.stack.length || S.route !== root) go(root, 'tab'); else window.scrollTo({ top:0, behavior:reducedMotion() ? 'auto' : 'smooth' }); }
      else { S.mFilter = null; go(root, 'tab'); }
      break;
    }
    case 'm-scope': S.taskScope = d.v; S.mFilter = null; go(d.v, 'replace'); break;
    case 'm-status': S.mStatus[d.key] = d.v; renderView(); break;
    case 'm-clear-filter': S.mFilter = null; renderView(); break;
    case 'm-card':
      S.mFilter = d.filter === 'today' || d.filter === 'overdue' ? d.filter : null;
      S.mStatus['all-tasks'] = d.filter === 'done' ? 'complete' : 'open';
      S.taskScope = 'all-tasks'; go('all-tasks', 'tab'); break;
    case 'm-stage': S.leadStage = d.stage; go('hit-list', 'tab'); break;
    case 'm-stage-chip': S.leadStage = d.stage; renderView(); document.querySelector(`[data-stage="${d.stage}"].m-chip`)?.scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' }); break;
    case 'm-check': {
      const t = S.tasks.find(x => x.id === d.id); if(!t) return;
      const target = t.status === 'complete' ? 'open' : 'complete';
      el.classList.toggle('on', target === 'complete'); el.innerHTML = target === 'complete' ? I.tick : '';
      setTaskStatus(d.id, target, target === 'complete' ? 650 : 0); break;
    }
    case 'cal-select': S.calSel = d.date; renderView(); break;
    case 'm-cal-plus': {
      const day = S.calShown || today();
      const label = dayLabel(day);
      const v = await actionSheet({ title:label, actions:[{ label:'New Meeting', value:'meeting' }, { label:'New Event', value:'event' }, { label:'New Task Due This Day', value:'task' }] });
      if(v === 'meeting' || v === 'event') openEvent(null, { date:day, kind:v }); else if(v === 'task') openTask(null, { due:day });
      break;
    }
    case 'clear-due': m.draft.due_date = ''; m.dirty = true; renderModal(); break;
    case 'm-fin-add': S.modal = { type:'fin-add', kind:d.kind }; renderModal(); break;
    case 'fin-menu': finMenu(d.table, d.id); break;
    case 'logout': await sb.auth.signOut(); break;
    case 'toggle-older': S.showOlder[S.route] = !S.showOlder[S.route]; renderView(); break;

    case 'new-task': openTask(null, { client:d.client || '', person:d.person || '' }); break;
    case 'open-task': openTask(d.id); break;
    case 'new-lead': openLead(null, { stage:d.stage || 'to_call' }); break;
    case 'open-lead': openLead(d.id); break;
    case 'new-event': openEvent(null, { kind:d.kind || 'meeting', date:isMobile() ? (S.calShown || today()) : today() }); break;
    case 'open-event': openEvent(d.id); break;
    case 'open-day': S.modal = { type:'day', date:d.date, title:'', time:'' }; renderModal(); setTimeout(() => document.querySelector('[data-m="title"]')?.focus(), 30); break;
    case 'close-modal': closeModal(); break;

    case 'seg': {
      let v = d.v;
      if(d.field === 'all_day') v = d.v === '1';
      m.draft[d.field] = v;
      if(d.field === 'kind' && m.type === 'event'){ if(v === 'meeting') m.draft.all_day = false; else if(!m.draft.event_time) m.draft.all_day = true; }
      m.dirty = true; renderModal(); break;
    }
    case 'toggle-allday': m.draft.all_day = !m.draft.all_day; m.dirty = true; renderModal(); break;
    case 'cal-filter': S.calFilter[d.k] = !S.calFilter[d.k]; saveCalFilter(); renderView(); break;
    case 'cal-view': S.calView = d.v; renderView(); window.scrollTo(0,0); break;
    case 'day-new': { const date = m.date, kind = d.kind; S.modal = null; openEvent(null, { date, kind }); break; }
    case 'toggle-assignee': {
      const i = m.draft.assignees.indexOf(d.id);
      if(i >= 0) m.draft.assignees.splice(i,1); else m.draft.assignees.push(d.id);
      m.dirty = true; renderModal(); break;
    }
    case 'check-add': {
      const text = (m.newItem || '').trim(); if(!text) return;
      m.draft.checklist.push({ id:uid(), text, done:false }); m.newItem = ''; m.dirty = true; renderModal();
      document.querySelector('[data-m="newItem"]')?.focus(); break;
    }
    case 'check-toggle': m.draft.checklist[+d.i].done = !m.draft.checklist[+d.i].done; m.dirty = true; renderModal(); break;
    case 'check-remove': m.draft.checklist.splice(+d.i,1); m.dirty = true; renderModal(); break;
    case 'task-save': saveTask(); break;
    case 'task-delete': deleteTask(); break;
    case 'comment-add': addComment(); break;

    case 'lead-save': saveLead(); break;
    case 'lead-delete': deleteLead(); break;
    case 'note-add': addNote(); break;
    case 'go-client': dismissModal(); go('client:' + d.id, isMobile() ? 'push' : undefined); break;

    case 'event-save': saveEvent(); break;
    case 'event-delete': deleteEvent(); break;
    case 'day-add-task': { const date = m.date; S.modal = null; openTask(null, { due:date }); break; }

    case 'cal-prev': S.cal.m--; if(S.cal.m < 0){ S.cal.m = 11; S.cal.y--; } S.calSel = null; S.calAnim = 'cal-prev'; renderView(); break;
    case 'cal-next': S.cal.m++; if(S.cal.m > 11){ S.cal.m = 0; S.cal.y++; } S.calSel = null; S.calAnim = 'cal-next'; renderView(); break;
    case 'cal-today': { const n = new Date(); S.cal = { y:n.getFullYear(), m:n.getMonth() }; S.calSel = today(); renderView(); break; }

    case 'arch-prev': S.archMonth = shiftMonth(archMonthKey(), -1); renderView(); break;
    case 'arch-next': { const nx = shiftMonth(archMonthKey(), 1); if(nx <= shiftMonth(thisMonth(), -1)){ S.archMonth = nx; renderView(); } break; }
    case 'arch-last': S.archMonth = null; renderView(); break;
    case 'fin-prev': S.finMonth = shiftMonth(finMonth(), -1); renderView(); break;
    case 'fin-next': S.finMonth = shiftMonth(finMonth(), 1); renderView(); break;
    case 'fin-now': S.finMonth = null; renderView(); break;
    case 'fin-change': {
      const row = finList(d.table).find(r => r.id === d.id); if(!row) return;
      S.modal = { type:'amount', table:d.table, id:d.id, label:finLabel(d.table,row), value:row.amount, month:finMonth() }; renderModal(); break;
    }
    case 'amount-save': {
      const amt = Number(m.value); if(!Number.isFinite(amt) || amt < 0){ toast('Enter a valid amount', true); return; }
      const { table, id } = m; dismissModal(); finChange(table, id, amt); break;
    }
    case 'fin-stop': finStop(d.table, d.id); break;
    case 'fin-remove': finRemove(d.table, d.id); break;
    case 'ret-add': {
      const cid = val('ret-client'), amt = Number(val('ret-amt'));
      if(!cid || !(amt > 0)){ toast('Choose a client and an amount', true); return; }
      if(await db(sb.from('client_retainers').insert({ client_id:cid, amount:amt, start_month:finMonth() }), 'Retainer added')){ if(S.modal?.type === 'fin-add') dismissModal(); loadAll(); }
      break;
    }
    case 'rev-add': {
      const desc = val('rev-desc'), amt = Number(val('rev-amt'));
      if(!desc || !(amt > 0)){ toast('Add a description and an amount', true); return; }
      if(await db(sb.from('revenue_items').insert({ description:desc, amount:amt, month:finMonth(), client_id:val('rev-client') || null }), 'Revenue added')){ if(S.modal?.type === 'fin-add') dismissModal(); loadAll(); }
      break;
    }
    case 'exp-add': {
      const cat = val('exp-cat'), amt = Number(val('exp-amt'));
      if(!cat || !(amt > 0)){ toast('Add a category and an amount', true); return; }
      if(await db(sb.from('expenses').insert({ category:cat, description:val('exp-desc') || null, amount:amt, recurring:val('exp-rec') === '1', start_month:finMonth() }), 'Expense added')){ if(S.modal?.type === 'fin-add') dismissModal(); loadAll(); }
      break;
    }
  }
});

document.addEventListener('input', e => {
  if(e.target.classList?.contains('grow')) autoGrow(e.target);
  if(e.target.hasAttribute?.('data-archive-search')){
    S.archQuery = e.target.value;
    const box = document.getElementById('archive-results');
    if(box) box.innerHTML = isMobile() ? mArchiveResultsHTML() : archiveResultsHTML();
    return;
  }
  const m = S.modal; if(!m) return;
  const f = e.target.dataset.f, k = e.target.dataset.m;
  if(f && m.draft){ m.draft[f] = e.target.value; m.dirty = true; }
  else if(k){ m[k] = e.target.value; }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && S.modal && !document.getElementById('confirm').innerHTML){ closeModal(); return; }
  if(e.key === 'Enter' && e.target.classList?.contains('m-title-inp')){ e.preventDefault(); e.target.blur(); return; }
  const enter = e.target.dataset?.enter;
  if(e.key === 'Enter' && enter){ e.preventDefault(); e.target.dispatchEvent(new Event('input', { bubbles:true })); document.querySelector(`[data-action="${enter}"]`)?.click(); return; }
  if(e.key === 'Enter' && e.target.matches?.('.tcard,.cal-cell')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', async e => {
  if(e.target.dataset.form !== 'login') return;
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]'), err = document.getElementById('lerr');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Signing in';
  const { error } = await sb.auth.signInWithPassword({ email:document.getElementById('le').value.trim(), password:document.getElementById('lp').value });
  if(error){ err.textContent = error.message === 'Invalid login credentials' ? 'That email and password don\'t match. Check them and try again.' : error.message; btn.disabled = false; btn.textContent = 'Sign in'; }
});

/* Drag and drop */
document.addEventListener('dragstart', e => {
  const c = e.target.closest?.('[data-drag]'); if(!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.drag); e.dataTransfer.effectAllowed = 'move';
  requestAnimationFrame(() => c.classList.add('dragging'));
});
document.addEventListener('dragend', () => document.querySelectorAll('.dragging,.over').forEach(x => x.classList.remove('dragging','over')));
document.addEventListener('dragover', e => {
  const col = e.target.closest?.('[data-drop]'); if(!col) return;
  e.preventDefault();
  document.querySelectorAll('.col.over').forEach(x => { if(x !== col) x.classList.remove('over'); });
  col.classList.add('over');
});
document.addEventListener('drop', async e => {
  const col = e.target.closest?.('[data-drop]'); if(!col) return;
  e.preventDefault(); col.classList.remove('over');
  const [kind, id] = (e.dataTransfer.getData('text/plain') || '').split(':');
  const [dropKind, target] = col.dataset.drop.split(':');
  if(!id || kind !== dropKind) return;
  if(kind === 'task') setTaskStatus(id, target);
  else if(kind === 'lead') setLeadStage(id, target);
});

window.addEventListener('hashchange', () => { if(isMobile()) return; const r = decodeURIComponent(location.hash.slice(1)); if(r && r !== S.route){ S.route = r; renderView(); } });

document.addEventListener('focusout', () => setTimeout(() => {
  const a = document.activeElement;
  if(S.pendingRender && !(a && $view.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){ S.pendingRender = false; renderView(); }
}, 60));
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && S.session && S.loaded) loadAll(); });
MQ.addEventListener('change', () => {
  if(isMobile()){ if(!ROOTS.has(S.route) && !S.stack.length) S.stack = ancestry(S.route); }
  else { S.stack = []; if(S.route === 'more') S.route = 'dashboard'; }
  renderView(); if(S.modal){ S.modal._shown = true; renderModal(); }
});

/* ================= Boot ================= */
if(isMobile() && !ROOTS.has(S.route)) S.stack = ancestry(S.route);
sb.auth.onAuthStateChange((_event, session) => {
  const had = !!S.session;
  S.booting = false;
  S.session = session;
  if(session && !had){ S.loaded = false; renderView(); setTimeout(() => { loadAll(); subscribeRealtime(); }, 0); }
  else if(!session){ S.loaded = false; S.me = null; S.modal = null; renderModal(); unsubscribeRealtime(); renderView(); }
});
renderView();
</script>
</body>
